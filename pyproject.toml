[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-rift"
version = "0.2.0"
description = "Actor-conditioned offline next-action policies for Summoner's Rift"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "requests>=2.31,<3"]

[project.optional-dependencies]
inference = ["torch>=2.5,<3"]
train = ["torch>=2.5,<3"]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
rift-train = "offline_rift.training.trainer:main"
rift-live = "offline_rift.inference.live_client:main"
rift = "offline_rift.workflow:main"
rift-ui = "offline_rift.ui.server:main"

[tool.setuptools]
py-modules = ["workflow"]

[tool.setuptools.package-dir]
"" = "."
offline_rift = "production/src/offline_rift"
rift_common = "common/src/rift_common"

[tool.setuptools.packages.find]
where = ["production/src", "common/src"]
include = ["offline_rift*", "rift_common*"]

[tool.setuptools.package-data]
"offline_rift.ui" = ["static/*.html", "static/*.css", "static/*.js"]
"rift_common" = ["objective_rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
