[project]
name = "offlinerift-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["build==1.3.0", "mypy==1.18.2", "pre-commit==4.3.0", "pytest==8.4.2", "ruff==0.14.3"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["offlinerift"]

[tool.mypy]
strict = true
files = ["packages", "tests", "scripts"]
explicit_package_bases = true
mypy_path = ["packages/domain/src", "packages/ingestion/src", "packages/storage/src", "packages/features/src", "packages/models/src", "packages/training/src", "packages/evaluation/src", "packages/serving/src", "packages/interface/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
