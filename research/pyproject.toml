[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-rift-research"
version = "0.1.0"
description = "Optional Offline Rift experiments, cohort studies and label review"
requires-python = ">=3.10"
dependencies = ["offline-rift[train]==0.1.0"]

[project.scripts]
rift-research = "rift_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rift_research = ["static/*.html"]
