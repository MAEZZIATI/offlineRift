[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "offlinerift-storage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["offlinerift-domain==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/offlinerift"]

[tool.uv.sources]
offlinerift-domain = { workspace = true }
