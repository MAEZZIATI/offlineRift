[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-rift-research"
version = "0.2.0"
description = "Offline Rift next-action dataset and policy studies"
requires-python = ">=3.10"
dependencies = ["offline-rift[train]==0.2.0"]

[project.scripts]
rift-research = "rift_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
