name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
      - run: uv python install 3.11
      - run: uv sync --frozen --all-packages
      - run: make check
      - run: make smoke
