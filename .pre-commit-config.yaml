repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict types
        entry: uv run --frozen --all-packages mypy
        language: system
        pass_filenames: false
